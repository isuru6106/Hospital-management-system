# Application Configuration
spring.application.name=hospital-manager

# MySQL Database Configuration (XAMPP - Port 3308)
spring.datasource.url=jdbc:mysql://127.0.0.1:3308/hospital_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8082

# JWT Configuration
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.expiration=86400000

